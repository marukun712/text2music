<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>text2music</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>

<body>
  <main>
    <header>
      <h1>text2music</h1>
      <p>コード進行を用いた低速音波通信</p>
    </header>

    <main class="container">
      <section>
        <h2>エンコード</h2>
        <form id="encode-form">
          <label>
            コード進行 (カンマ区切り)
            <input type="text" id="chords" value="C4,F4,G4,A4" required />
          </label>
          <label>
            メッセージ
            <input type="text" id="message" placeholder="送信したいテキストを入力" required />
          </label>
          <button type="submit">WAV を生成</button>
        </form>
        <p id="encode-status"></p>
      </section>

      <section>
        <h2>デコード</h2>
        <form id="decode-form">
          <label>
            コード進行 (エンコード時と同じもの)
            <input type="text" id="decode-chords" value="C4,F4,G4,A4" required />
          </label>
          <label>
            音声ファイル
            <input type="file" id="audio-file" accept="audio/*" required />
          </label>
          <button type="submit">デコード</button>
        </form>
        <p>復元テキスト: <strong id="decode-output"></strong></p>
      </section>
    </main>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
